<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabTrack – Inventario de Laboratorio</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--pr:#1f3864;--ac:#2e75b6;--bd:#d9dfe8}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mu:#97a4b4;--pr:#6fa3e0;--ac:#3d86d0;--bd:#2c3744}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
@media(prefers-color-scheme:dark){header{color:#10151c}}
main{max-width:1000px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat b{display:block;font-size:28px;color:var(--ac)}.stat span{color:var(--mu);font-size:13px}
input,select,button{font:inherit;padding:8px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.del{background:#c0392b}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar input{flex:1;min-width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600}td.act{display:flex;gap:6px}td.act button{padding:5px 9px;font-size:12px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}.Disponible{background:#2e8b57}.Prestado{background:#d68910}.Mantenimiento{background:#7f8c8d}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(420px,92vw)}
dialog::backdrop{background:#0008}label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}dialog input,dialog select{width:100%}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#login{max-width:340px;margin:12vh auto}
</style></head><body>
<div id="login" class="card"><h2 style="margin-top:0">LabTrack</h2><p style="color:var(--mu);margin-top:-8px">Inicia sesión para continuar</p>
<label for="u">Usuario</label><input id="u" style="width:100%" autocomplete="username"><label for="p">Contraseña</label><input id="p" type="password" style="width:100%" autocomplete="current-password">
<div class="err" id="le" role="alert"></div><div class="row"><button id="lb">Entrar</button></div><p style="color:var(--mu);font-size:12px">Demo: admin / 1234</p></div>
<div id="app" hidden>
<header><strong>LabTrack · Inventario</strong><button class="sec" id="out" style="color:inherit;border-color:#fff8">Cerrar sesión</button></header>
<main><p id="notice" role="status" class="err"></p>
<div class="card stats" id="stats"></div>
<div class="card"><div class="bar"><input id="q" aria-label="Buscar equipos" placeholder="Buscar por nombre o código"><select id="f" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option>Disponible</option><option>Prestado</option><option>Mantenimiento</option></select><button id="add">+ Nuevo equipo</button><button id="backup" class="sec">Descargar respaldo</button></div>
<div class="tw"><table><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Ubicación</th><th>Estado</th><th>Prestado a</th><th>Fecha de préstamo</th><th>Acciones</th></tr></thead><tbody id="tb"></tbody></table></div><p id="empty" style="color:var(--mu)" hidden>No se encontraron equipos.</p></div>
</main></div>
<dialog id="dm"><form method="dialog" id="fm"><h3 id="dt" style="margin-top:0"></h3>
<label for="c">Código</label><input id="c" required maxlength="100"><label for="n">Nombre</label><input id="n" required maxlength="100"><label for="g">Categoría</label><select id="g"><option>Electrónica</option><option>Cómputo</option><option>Medición</option><option>Herramientas</option></select>
<label for="l">Ubicación</label><input id="l" required maxlength="100"><label for="s">Estado</label><select id="s"><option>Disponible</option><option>Mantenimiento</option></select>
<div class="err" id="fe" role="alert"></div><div class="row"><button type="button" class="sec" id="cx">Cancelar</button><button type="submit">Guardar</button></div></form></dialog>
<dialog id="dl"><form method="dialog"><h3 style="margin-top:0">Registrar préstamo</h3><label for="who">Solicitante</label><input id="who" required maxlength="100"><label for="loanDate">Fecha de préstamo</label><input id="loanDate" type="date" required><div class="err" id="loanError" role="alert"></div><div class="row"><button type="button" class="sec" id="lx">Cancelar</button><button type="submit">Prestar</button></div></form></dialog>
<script>
const $=i=>document.getElementById(i), K="labtrack_equipos", S="labtrack_sesion";
let storageProblem=false;
const seed=()=>[
 {id:1,codigo:"EQ-001",nombre:"Osciloscopio Rigol",categoria:"Medición",ubicacion:"Lab 1",estado:"Disponible",prestadoA:"",fechaPrestamo:""},
 {id:2,codigo:"EQ-002",nombre:"Laptop Dell",categoria:"Cómputo",ubicacion:"Lab 2",estado:"Disponible",prestadoA:"",fechaPrestamo:""},
 {id:3,codigo:"EQ-003",nombre:"Multímetro Fluke",categoria:"Medición",ubicacion:"Lab 1",estado:"Mantenimiento",prestadoA:"",fechaPrestamo:""}
];
function load(){try{const raw=localStorage.getItem(K);if(raw===null)return seed();const d=JSON.parse(raw);if(!Array.isArray(d)||d.some(x=>!x||!['codigo','nombre','categoria','ubicacion','estado'].every(k=>typeof x[k]==='string')))throw Error('Datos no válidos');return d.map(x=>({...x,prestadoA:x.prestadoA||'',fechaPrestamo:x.fechaPrestamo||''}));}catch(e){storageProblem=true;return seed();}}
let data=load(),editId=null,loanId=null;
function save(next){try{localStorage.setItem(K,JSON.stringify(next));data=next;storageProblem=false;render();return true;}catch(e){$('notice').textContent='No se pudo guardar. Revisa los permisos o el espacio del navegador. Los cambios no se aplicaron.';return false;}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateText=v=>v?v.split('-').reverse().join('/'):'—';
function show(on){$('login').hidden=on;$('app').hidden=!on;if(on)render();}
$('lb').onclick=()=>{if($('u').value.trim()==='admin'&&$('p').value==='1234'){try{sessionStorage.setItem(S,'1')}catch(e){}$('le').textContent='';show(true);}else $('le').textContent='Usuario o contraseña incorrectos.';};
['u','p'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')$('lb').click()});
$('out').onclick=()=>{try{sessionStorage.removeItem(S)}catch(e){}$('u').value=$('p').value='';$('le').textContent='';show(false)};
function render(){
 const q=$('q').value.trim().toLowerCase(),f=$('f').value,cnt=e=>data.filter(x=>x.estado===e).length;
 $('notice').textContent=storageProblem?'No se pudieron leer los datos guardados. Se muestran ejemplos. Descarga un respaldo antes de continuar.':'';
 $('stats').innerHTML=[['Total',data.length],['Disponibles',cnt('Disponible')],['Prestados',cnt('Prestado')],['Mantenimiento',cnt('Mantenimiento')]].map(a=>`<div class="stat"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('');
 const rows=data.filter(x=>(!f||x.estado===f)&&(x.nombre.toLowerCase().includes(q)||x.codigo.toLowerCase().includes(q)));
 $('empty').hidden=rows.length>0;
 $('tb').innerHTML=rows.map(x=>`<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${esc(x.categoria)}</td><td>${esc(x.ubicacion)}</td><td><span class="tag ${esc(x.estado)}">${esc(x.estado)}</span></td><td>${esc(x.prestadoA||'—')}</td><td>${esc(dateText(x.fechaPrestamo))}</td><td class="act">
 ${x.estado==='Prestado'?`<button data-a="ret" data-i="${x.id}">Devolver</button>`:x.estado==='Disponible'?`<button data-a="loan" data-i="${x.id}">Prestar</button>`:''}
 <button class="sec" data-a="ed" data-i="${x.id}">Editar</button><button class="del" data-a="rm" data-i="${x.id}">Eliminar</button></td></tr>`).join('');
}
$('q').oninput=$('f').onchange=render;
$('add').onclick=()=>{editId=null;$('dt').textContent='Nuevo equipo';$('fm').reset();$('fe').textContent='';$('s').disabled=false;$('dm').showModal()};
$('cx').onclick=()=>$('dm').close();$('lx').onclick=()=>$('dl').close();
$('fm').onsubmit=e=>{
 e.preventDefault();const codigo=$('c').value.trim(),nombre=$('n').value.trim(),ubicacion=$('l').value.trim();
 if(!codigo||!nombre||!ubicacion){$('fe').textContent='Completa todos los campos.';return;}
 if(data.some(x=>x.codigo.toLowerCase()===codigo.toLowerCase()&&x.id!==editId)){$('fe').textContent='Ese código ya existe.';return;}
 const values={codigo,nombre,ubicacion,categoria:$('g').value};
 let next;if(editId!==null){next=data.map(x=>x.id===editId?{...x,...values,estado:x.estado==='Prestado'?'Prestado':$('s').value}:x)}else{next=[...data,{id:Date.now(),...values,estado:$('s').value,prestadoA:'',fechaPrestamo:''}]}
 if(save(next))$('dm').close();
};
$('dl').querySelector('form').onsubmit=e=>{
 e.preventDefault();const w=$('who').value.trim(),date=$('loanDate').value,x=data.find(x=>x.id===loanId);
 if(!w||!date){$('loanError').textContent='Escribe el solicitante y la fecha.';return;}
 if(date>today()){$('loanError').textContent='La fecha no puede ser futura.';return;}
 if(!x||x.estado!=='Disponible'){$('loanError').textContent='El equipo no está disponible.';return;}
 if(save(data.map(y=>y.id===loanId?{...y,estado:'Prestado',prestadoA:w,fechaPrestamo:date}:y)))$('dl').close();
};
$('tb').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const id=+b.dataset.i,x=data.find(y=>y.id===id),a=b.dataset.a;if(!x)return;
 if(a==='ed'){editId=id;$('dt').textContent='Editar equipo';$('c').value=x.codigo;$('n').value=x.nombre;$('g').value=x.categoria;$('l').value=x.ubicacion;$('s').value=x.estado==='Prestado'?'Disponible':x.estado;$('s').disabled=x.estado==='Prestado';$('fe').textContent='';$('dm').showModal()}
 if(a==='rm'){if(x.estado==='Prestado')return alert('No se puede eliminar un equipo prestado.');if(confirm('¿Eliminar '+x.nombre+'?'))save(data.filter(y=>y.id!==id));}
 if(a==='loan'){loanId=id;$('who').value='';$('loanDate').value=today();$('loanDate').max=today();$('loanError').textContent='';$('dl').showModal()}
 if(a==='ret')save(data.map(y=>y.id===id?{...y,estado:'Disponible',prestadoA:'',fechaPrestamo:''}:y));
};
$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({sistema:'LabTrack',exportado:new Date().toISOString(),equipos:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LabTrack_respaldo_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
try{if(sessionStorage.getItem(S)==='1')show(true)}catch(e){}
</script></body></html>
